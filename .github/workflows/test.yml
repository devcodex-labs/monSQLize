name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'fix/gridfs-id-ownership-v01']

# Superseded PR revisions must not accumulate long-running test jobs.
# Cancelled prior SHAs are never accepted as evidence for the current HEAD.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore MongoDB memory-server binaries
        uses: actions/cache@v5
        with:
          path: .cache/mongodb-memory-server/binaries
          key: mongodb-memory-server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/validation/server-matrix-config.cjs') }}

      - name: Check docs example matrix
        run: npm run check:docs-examples

      - name: Type check
        run: npm run type-check

      - name: Enforce file-size guard
        run: npm run check:sizes:strict

      - name: Run full test suite
        run: npm test

      - name: Run compatibility guard
        run: npm run test:compatibility

  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore MongoDB memory-server binaries
        uses: actions/cache@v5
        with:
          path: .cache/mongodb-memory-server/binaries
          key: mongodb-memory-server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/validation/server-matrix-config.cjs') }}

      - name: Run the complete release gate
        run: npm run release:preflight
